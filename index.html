<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長安國小｜資訊應用競賽管理系統</title>
    
    <!-- Google Fonts: 思源宋體 Noto Serif TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Serif TC"', 'serif'],
                        serif: ['"Noto Serif TC"', 'serif'],
                    },
                    colors: {
                        'lib-bg': '#EFF6FF',       // 冰川淺藍背景
                        'lib-card': '#FFFFFF',     // 純白卡片
                        'lib-wood': '#1E3A8A',     // 深海科技藍 (主色/導覽列邊框)
                        'lib-blue': '#0284C7',     // 科技亮藍 (按鈕/標籤)
                        'lib-indigo': '#4F46E5',   // 靛藍
                        'lib-cyan': '#0891B2',     // 青藍
                        'lib-sky': '#0369A1',      // 天空深藍
                        'lib-slate': '#334155',    // 石板灰藍
                        'lib-note': '#F0F9FF',     // 淡藍資訊底色
                    }
                }
            }
        }
    </script>

    <style>
        /* 全站強制思源宋體，但排除 FontAwesome 圖示避免顯示方塊 */
        *:not(i):not(.fa):not(.fas):not(.far):not(.fab):not(.fa-solid):not(.fa-regular):not(.fa-brands) {
            font-family: 'Noto Serif TC', serif !important;
        }

        body {
            background-color: #EFF6FF;
            color: #1E293B;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 科技藍卡片樣式 */
        .tech-card {
            background: #FFFFFF;
            border-radius: 0.75rem;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.08);
            border: 1px solid #DBEAFE;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .tech-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(30, 58, 138, 0.14);
        }

        /* 統一輸入框與下拉選單樣式 */
        .lib-input {
            width: 100%;
            padding: 0.55rem 0.85rem;
            border: 1.5px solid #BFDBFE;
            border-radius: 0.5rem;
            background-color: #FFFFFF;
            color: #1E293B;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .lib-input:focus {
            border-color: #0284C7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        select.lib-input option {
            background-color: #FFFFFF;
            color: #1E293B;
        }

        /* 富文本編輯器樣式 */
        .editor-content {
            min-height: 140px;
            max-height: 300px;
            overflow-y: auto;
            padding: 0.75rem;
            border: 1.5px solid #BFDBFE;
            border-top: none;
            border-radius: 0 0 0.5rem 0.5rem;
            background: #FFFFFF;
        }
        .editor-content:focus {
            outline: none;
            border-color: #0284C7;
        }

        /* 自訂捲軸 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #EFF6FF;
        }
        ::-webkit-scrollbar-thumb {
            background: #93C5FD;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3B82F6;
        }
    </style>
</head>
<body>

    <!-- 頂部導覽列 -->
    <nav class="bg-white border-b-4 border-lib-wood shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- 左側 Logo 與標題 -->
                <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('gallery')">
                    <div class="w-10 h-10 bg-lib-wood text-white rounded-lg flex items-center justify-center shadow">
                        <i class="fa-solid fa-desktop text-xl"></i>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-xl sm:text-2xl font-black text-slate-900 tracking-wide" id="nav-school-name">長安國小</span>
                        <span class="text-slate-300 text-xl">|</span>
                        <span class="text-sm sm:text-base font-bold text-lib-blue" id="nav-contest-title">資訊應用競賽</span>
                    </div>
                </div>

                <!-- 右側選單按鈕 -->
                <div class="flex items-center space-x-2 sm:space-x-3" id="nav-actions">
                    <button onclick="switchView('gallery')" class="px-3 py-2 rounded-lg text-sm font-bold text-slate-700 hover:bg-blue-50 hover:text-lib-blue transition">
                        <i class="fa-solid fa-grid-2 mr-1"></i>作品大廳
                    </button>
                    <button onclick="switchView('news')" class="px-3 py-2 rounded-lg text-sm font-bold text-slate-700 hover:bg-blue-50 hover:text-lib-blue transition">
                        <i class="fa-solid fa-bullhorn mr-1"></i>最新消息
                    </button>
                    <div id="user-nav-area" class="flex items-center space-x-2">
                        <!-- 動態渲染登入狀態或按鈕 -->
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主內容區 -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- 1. 系統平滑載入中畫面 (防止連線閃爍) -->
        <div id="loading-screen" class="flex flex-col items-center justify-center py-24">
            <div class="w-14 h-14 border-4 border-blue-200 border-t-lib-wood rounded-full animate-spin mb-4"></div>
            <p class="text-lg font-bold text-lib-wood tracking-wider">系統讀取中，請稍候...</p>
        </div>

        <!-- 2. 連線真正異常提示 -->
        <div id="error-screen" class="hidden max-w-lg mx-auto bg-red-50 border-2 border-red-200 rounded-xl p-8 text-center my-12">
            <i class="fa-solid fa-triangle-exclamation text-4xl text-red-500 mb-3"></i>
            <h2 class="text-xl font-bold text-red-800 mb-2">資料庫連線發生問題</h2>
            <p class="text-sm text-red-600 mb-4" id="error-detail">請確認 Firebase 設定金鑰是否正確，或檢查網路連線狀態。</p>
            <button onclick="location.reload()" class="px-5 py-2 bg-red-600 text-white rounded-lg font-bold hover:bg-red-700 transition">重新整理</button>
        </div>

        <!-- 3. 動態視圖容器 -->
        <div id="app-container" class="hidden"></div>

    </main>

    <!-- 底部頁尾 -->
    <footer class="bg-lib-wood text-blue-100 py-5 mt-12 border-t-4 border-lib-blue">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm flex flex-col sm:flex-row justify-between items-center">
            <p id="footer-text">© 2026 長安國小資訊組｜資訊應用競賽展示與評審系統</p>
            <p class="text-xs text-blue-300 mt-1 sm:mt-0"><i class="fa-solid fa-shield-halved mr-1"></i>SHA-256 密碼安全加密保護</p>
        </div>
    </footer>

    <!-- 全站通用提示 Toast -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <div class="bg-slate-900 text-white px-5 py-3 rounded-lg shadow-xl flex items-center space-x-3 border-l-4 border-lib-blue">
            <i id="toast-icon" class="fa-solid fa-circle-check text-sky-400"></i>
            <span id="toast-msg" class="text-sm font-bold">操作成功</span>
        </div>
    </div>

    <!-- Modal 1: 帳號修改視窗 -->
    <div id="edit-user-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl border-t-4 border-lib-wood">
            <div class="flex justify-between items-center mb-4 pb-2 border-b">
                <h3 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-user-pen text-lib-blue mr-2"></i>修改帳號資料</h3>
                <button onclick="closeModal('edit-user-modal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form onsubmit="saveEditedUser(event)" class="space-y-4">
                <input type="hidden" id="edit-user-id">
                <div id="edit-user-class-group">
                    <label class="block text-sm font-bold text-slate-700 mb-1">班級（學生填寫）</label>
                    <input type="text" id="edit-user-class" class="lib-input" placeholder="例如：601">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">姓名</label>
                    <input type="text" id="edit-user-name" class="lib-input" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">登入帳號</label>
                    <input type="text" id="edit-user-username" class="lib-input" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">重設密碼 <span class="text-xs font-normal text-slate-500">(若不修改請留空)</span></label>
                    <input type="password" id="edit-user-password" class="lib-input" placeholder="輸入新密碼將以 SHA-256 加密儲存">
                </div>
                <div id="edit-user-role-group">
                    <label class="block text-sm font-bold text-slate-700 mb-1">系統角色</label>
                    <select id="edit-user-role" class="lib-input" onchange="toggleEditJudgeCategories()">
                        <option value="student">學生</option>
                        <option value="judge">評審</option>
                        <option value="admin">管理員</option>
                    </select>
                </div>
                <div id="edit-judge-categories-group" class="hidden bg-blue-50 p-3 rounded-lg border border-blue-200">
                    <label class="block text-sm font-bold text-lib-wood mb-2">指派評審項目（可多選，全不勾代表負責全部項目）</label>
                    <div id="edit-judge-categories-list" class="space-y-1.5 max-h-36 overflow-y-auto text-sm"></div>
                </div>
                <div class="flex justify-end space-x-2 pt-3 border-t">
                    <button type="button" onclick="closeModal('edit-user-modal')" class="px-4 py-2 rounded-lg bg-slate-100 text-slate-700 font-bold hover:bg-slate-200">取消</button>
                    <button type="submit" class="px-5 py-2 rounded-lg bg-lib-wood text-white font-bold hover:bg-blue-800">儲存變更</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal 2: 作品修改視窗 -->
    <div id="edit-work-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl border-t-4 border-lib-blue">
            <div class="flex justify-between items-center mb-4 pb-2 border-b">
                <h3 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-pen-to-square text-lib-blue mr-2"></i>修改參賽作品</h3>
                <button onclick="closeModal('edit-work-modal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form onsubmit="saveEditedWork(event)" class="space-y-4">
                <input type="hidden" id="edit-work-id">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">比賽項目</label>
                    <select id="edit-work-category" class="lib-input" required></select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">作品雲端連結 (Google Drive / 網址)</label>
                    <input type="url" id="edit-work-link" class="lib-input" required placeholder="https://drive.google.com/...">
                </div>
                <div class="flex justify-end space-x-2 pt-3 border-t">
                    <button type="button" onclick="closeModal('edit-work-modal')" class="px-4 py-2 rounded-lg bg-slate-100 text-slate-700 font-bold hover:bg-slate-200">取消</button>
                    <button type="submit" class="px-5 py-2 rounded-lg bg-lib-blue text-white font-bold hover:bg-sky-700">更新作品</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal 3: 自訂確認刪除視窗 -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-sm w-full p-6 shadow-2xl border-t-4 border-red-500 text-center">
            <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-trash-can text-xl"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-2" id="confirm-title">確定要刪除嗎？</h3>
            <p class="text-sm text-slate-600 mb-6" id="confirm-message">此操作無法復原，請確認是否繼續。</p>
            <div class="flex justify-center space-x-3">
                <button onclick="closeModal('confirm-modal')" class="px-4 py-2 rounded-lg bg-slate-100 text-slate-700 font-bold hover:bg-slate-200">取消</button>
                <button id="confirm-yes-btn" class="px-5 py-2 rounded-lg bg-red-600 text-white font-bold hover:bg-red-700">確定刪除</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK 與應用程式核心邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // 請在此填入您的 Firebase 專案設定金鑰
        // ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyAOfAUMdUWJ1rDfkrLt-B3egRhv8kOVUc4",
  authDomain: "chanesgame.firebaseapp.com",
  projectId: "chanesgame",
  storageBucket: "chanesgame.firebasestorage.app",
  messagingSenderId: "720126054959",
  appId: "1:720126054959:web:85dc5389bb7c5df58c6cda"
};



        // 全域狀態管理
        let db;
        let currentUser = null;
        let currentView = 'gallery';
        let currentAdminTab = 'works';
        let selectedCategoryFilter = 'ALL';
        let selectedWorkIds = new Set();
        let selectedStudentIds = new Set();
        let selectedJudgeWorkId = null;

        let state = {
            settings: {
                schoolName: '長安國小',
                contestTitle: '資訊應用競賽',
                allowSubmission: true
            },
            categories: [],
            users: [],
            works: [],
            scores: [],
            news: []
        };

        // SHA-256 密碼雜湊工具函式
        async function hashPassword(plainText) {
            if (!plainText) return '';
            const encoder = new TextEncoder();
            const data = encoder.encode(plainText);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // XSS 安全跳脫字元
        window.escapeHtml = function(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        };

        // 姓名遮罩 (保護隱私：王小明 -> 王O明)
        window.maskName = function(name) {
            if (!name) return '';
            if (name.length <= 1) return name;
            if (name.length === 2) return name[0] + 'O';
            return name[0] + 'O'.repeat(name.length - 2) + name[name.length - 1];
        };

        // 解析作品縮圖 (支援 Google Drive 與一般圖片網址)
        window.getThumbnailUrl = function(url) {
            if (!url) return '';
            const driveMatch = url.match(/(?:\/d\/|id=)([a-zA-Z0-9_-]{25,})/);
            if (driveMatch && driveMatch[1]) {
                return `https://drive.google.com/thumbnail?id=${driveMatch[1]}&sz=w800`;
            }
            if (/\.(jpg|jpeg|png|gif|webp|svg)(\?.*)?$/i.test(url)) {
                return url;
            }
            return '';
        };

        // 顯示提示訊息
        window.showToast = function(msg, isError = false) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const msgEl = document.getElementById('toast-msg');
            msgEl.textContent = msg;
            icon.className = isError ? 'fa-solid fa-circle-exclamation text-red-400' : 'fa-solid fa-circle-check text-sky-400';
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        };

        // 彈窗控制
        window.closeModal = function(id) {
            const el = document.getElementById(id);
            el.classList.add('hidden');
            el.classList.remove('flex');
        };

        window.openConfirmModal = function(title, message, onConfirm) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;
            const yesBtn = document.getElementById('confirm-yes-btn');
            yesBtn.onclick = async () => {
                closeModal('confirm-modal');
                await onConfirm();
            };
            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        // 初始化系統與 Firebase 監聽
        async function initSystem() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);

                // 檢查並初始化預設設定與預設管理員帳號 (admin / admin123)
                const settingsRef = doc(db, 'system', 'settings');
                const settingsSnap = await getDoc(settingsRef);
                if (!settingsSnap.exists()) {
                    await setDoc(settingsRef, state.settings);
                }

                const usersSnap = await getDocs(collection(db, 'users'));
                if (usersSnap.empty) {
                    const defaultAdminHash = await hashPassword('admin123');
                    await addDoc(collection(db, 'users'), {
                        username: 'admin',
                        passwordHash: defaultAdminHash,
                        name: '系統管理員',
                        role: 'admin',
                        className: '',
                        assignedCategories: []
                    });
                }

                // 恢復本地登入 Session
                const savedUser = sessionStorage.getItem('contest_user');
                if (savedUser) {
                    currentUser = JSON.parse(savedUser);
                }

                // 即時監聽所有集合
                let loadedCount = 0;
                const checkReady = () => {
                    loadedCount++;
                    if (loadedCount >= 5) {
                        document.getElementById('loading-screen').classList.add('hidden');
                        document.getElementById('app-container').classList.remove('hidden');
                        renderNav();
                        renderCurrentView();
                    }
                };

                onSnapshot(settingsRef, (snap) => {
                    if (snap.exists()) {
                        state.settings = snap.data();
                        document.getElementById('nav-school-name').textContent = state.settings.schoolName || '長安國小';
                        document.getElementById('nav-contest-title').textContent = state.settings.contestTitle || '資訊應用競賽';
                    }
                    checkReady();
                }, handleDbError);

                onSnapshot(collection(db, 'categories'), (snap) => {
                    state.categories = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order || 0) - (b.order || 0));
                    checkReady();
                }, handleDbError);

                onSnapshot(collection(db, 'users'), (snap) => {
                    state.users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    checkReady();
                }, handleDbError);

                onSnapshot(collection(db, 'works'), (snap) => {
                    state.works = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    checkReady();
                }, handleDbError);

                onSnapshot(collection(db, 'scores'), (snap) => {
                    state.scores = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    checkReady();
                }, handleDbError);

                onSnapshot(collection(db, 'news'), (snap) => {
                    state.news = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                    if (loadedCount >= 5 && currentView === 'news') renderCurrentView();
                }, handleDbError);

            } catch (err) {
                handleDbError(err);
            }
        }

        function handleDbError(err) {
            console.error("Firebase Error:", err);
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('error-screen').classList.remove('hidden');
            document.getElementById('error-detail').textContent = err.message || '無法連線至資料庫，請確認 Firebase 設定。';
        }

        // 切換視圖
        window.switchView = function(view) {
            currentView = view;
            renderNav();
            renderCurrentView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // 渲染導覽列右側按鈕
        function renderNav() {
            const area = document.getElementById('user-nav-area');
            if (!currentUser) {
                area.innerHTML = `
                    <button onclick="switchView('login')" class="px-4 py-2 rounded-lg text-sm font-bold bg-lib-wood text-white hover:bg-blue-800 shadow transition">
                        <i class="fa-solid fa-right-to-bracket mr-1"></i>登入系統
                    </button>
                `;
                return;
            }

            let roleBtns = '';
            if (currentUser.role === 'student') {
                roleBtns = `
                    <button onclick="switchView('student')" class="px-3 py-2 rounded-lg text-sm font-bold bg-sky-100 text-lib-wood hover:bg-sky-200 transition">
                        <i class="fa-solid fa-cloud-arrow-up mr-1"></i>作品繳交
                    </button>
                `;
            } else if (currentUser.role === 'judge') {
                roleBtns = `

        window.handleLogin = async function(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const inputHash = await hashPassword(password);

            const foundUser = state.users.find(u => {
                if (u.username !== username) return false;
                // 優先比對 SHA-256 雜湊值
                if (u.passwordHash && u.passwordHash === inputHash) return true;
                // 向下相容舊資料明文密碼，若符合則於登入時自動升級為 SHA-256
                if (!u.passwordHash && u.password === password) return true;
                return false;
            });

            if (!foundUser) {
                showToast('帳號或密碼錯誤，請重新確認！', true);
                return;
            }

            // 若為舊明文帳號，自動加密升級並清除明文欄位
            if (!foundUser.passwordHash && foundUser.password) {
                try {
                    await updateDoc(doc(db, 'users', foundUser.id), {
                        passwordHash: inputHash,
                        password: ''
                    });
                } catch (err) {}
            }

            currentUser = {
                id: foundUser.id,
                username: foundUser.username,
                name: foundUser.name,
                role: foundUser.role,
                className: foundUser.className || '',
                assignedCategories: foundUser.assignedCategories || (foundUser.assignedCategory ? [foundUser.assignedCategory] : [])
            };
            sessionStorage.setItem('contest_user', JSON.stringify(currentUser));
            showToast(`歡迎回來，${currentUser.name}！`);

            if (currentUser.role === 'student') switchView('student');
            else if (currentUser.role === 'judge') switchView('judge');
            else if (currentUser.role === 'admin') switchView('admin');
            else switchView('gallery');
        };

        window.logout = function() {
            currentUser = null;
            sessionStorage.removeItem('contest_user');
            showToast('您已安全登出系統');
            switchView('gallery');
        };

            const comment = document.getElementById('score-comment').value.trim();
            const total = creativity + technique + design;

            const existing = state.scores.find(s => s.workId === workId && s.judgeId === currentUser.id);
            try {
                if (existing) {
                    await updateDoc(doc(db, 'scores', existing.id), {
                        creativity, technique, design, total, comment, updatedAt: Date.now()
                    });
                } else {
                    await addDoc(collection(db, 'scores'), {
                        workId,
                        judgeId: currentUser.id,
                        judgeName: currentUser.name,
                        creativity, technique, design, total, comment,
                        createdAt: Date.now()

                                    <p class="text-xs text-slate-400 mt-0.5">${new Date(n.createdAt).toLocaleString('zh-TW')}</p>
                                    <p class="text-sm text-slate-600 mt-2 whitespace-pre-line">${escapeHtml(n.content)}</p>
                                </div>
                                <button onclick="deleteDocHandler('news', '${n.id}', '確定刪除此則公告？')" class="text-red-500 hover:text-red-700">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // --- 分頁 E：網站基本設定 ---
            else if (currentAdminTab === 'settings') {
                tabContent = `
                    <form onsubmit="saveSiteSettings(event)" class="max-w-lg space-y-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">學校／主辦單位名稱</label>
                            <input type="text" id="set-school-name" class="lib-input" value="${escapeHtml(state.settings.schoolName)}" required>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">競賽名稱</label>
                            <input type="text" id="set-contest-title" class="lib-input" value="${escapeHtml(state.settings.contestTitle)}" required>
                        </div>
                        <div class="flex items-center space-x-2 pt-2">
                            <input type="checkbox" id="set-allow-sub" class="w-4 h-4 accent-lib-wood" ${state.settings.allowSubmission ? 'checked' : ''}>
                            <label for="set-allow-sub" class="text-sm font-bold text-slate-700">開放學生上傳與修改參賽作品</label>
                        </div>
                        <button type="submit" class="px-6 py-2.5 rounded-lg bg-lib-wood text-white font-bold text-sm hover:bg-blue-800 shadow">
                            <i class="fa-solid fa-floppy-disk mr-1.5"></i>儲存網站設定
                        </button>
                    </form>
                `;
            }

            container.innerHTML = `
                <div class="bg-white rounded-xl shadow-sm border border-blue-100 overflow-hidden">
                    <!-- 頁籤導覽列 (修復 lib-blue 樣式確保清晰可見) -->
                    <div class="flex flex-wrap border-b-2 border-lib-blue bg-slate-50 px-4 pt-3 gap-1.5">
                        ${tabs.map(t => {
                            const active = currentAdminTab === t.id;
                            return `
                                <button onclick="switchAdminTab('${t.id}')" class="px-4 py-2.5 rounded-t-lg text-sm font-bold transition flex items-center space-x-1.5 ${active ? 'bg-lib-blue text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-blue-50 border border-b-0 border-slate-200'}">
                                    <i class="fa-solid ${t.icon}"></i>
                                    <span>${t.label}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>

                    <!-- 頁籤內容區 -->
                    <div class="p-6">
                        ${tabContent}
                    </div>
                </div>
            `;
        }

        window.switchAdminTab = function(tabId) {
            currentAdminTab = tabId;
            renderAdminPanel(document.getElementById('app-container'));
        };

        // --- 管理後台互動函式 ---
        window.toggleNewJudgeCategories = function() {
            const role = document.getElementById('new-user-role').value;
            document.getElementById('new-judge-categories-wrap').classList.toggle('hidden', role !== 'judge');
            document.getElementById('new-user-class-wrap').classList.toggle('hidden', role !== 'student');
        };

        window.addSingleUser = async function(e) {
            e.preventDefault();
            const role = document.getElementById('new-user-role').value;
            const className = role === 'student' ? document.getElementById('new-user-class').value.trim() : '';
            const name = document.getElementById('new-user-name').value.trim();
            const username = document.getElementById('new-user-username').value.trim();
            const password = document.getElementById('new-user-password').value.trim();

            if (state.users.some(u => u.username === username)) {
                showToast('此帳號已存在，請使用其他帳號！', true);
                return;
            }

            const assignedCategories = role === 'judge'
                ? Array.from(document.querySelectorAll('input[name="new-judge-cat"]:checked')).map(el => el.value)
                : [];

            const passwordHash = await hashPassword(password);

            try {
                await addDoc(collection(db, 'users'), {
                    role,
                    className,
                    name,
                    username,
                    passwordHash,
                    assignedCategories
                });
                showToast('帳號已新增並完成 SHA-256 加密！');
                e.target.reset();
                toggleNewJudgeCategories();
            } catch (err) {
                showToast('新增失敗：' + err.message, true);
            }
        };

        window.bulkImportStudents = async function() {
            const raw = document.getElementById('bulk-users-input').value.trim();
            if (!raw) return;
            const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
            let count = 0;

            for (const line of lines) {
                const parts = line.split(',').map(p => p.trim());
                let className = '', name = '', username = '', password = '';
                if (parts.length >= 4) {
                    [className, name, username, password] = parts;
                } else if (parts.length === 3) {
                    [name, username, password] = parts;
                } else {
                    continue;
                }

                if (!username || !password || state.users.some(u => u.username === username)) continue;
                const passwordHash = await hashPassword(password);
                await addDoc(collection(db, 'users'), {
                    role: 'student',
                    className,
                    name,
                    username,
                    passwordHash,
                    assignedCategories: []
                });
                count++;
            }

            document.getElementById('bulk-users-input').value = '';
            showToast(`成功匯入 ${count} 筆學生帳號（已 SHA-256 加密）！`);
        };

        // 帳號編輯視窗
        window.openEditUserModal = function(userId) {
            const u = state.users.find(item => item.id === userId);
            if (!u) return;

            document.getElementById('edit-user-id').value = u.id;
            document.getElementById('edit-user-class').value = u.className || '';
            document.getElementById('edit-user-name').value = u.name;
            document.getElementById('edit-user-username').value = u.username;
            document.getElementById('edit-user-password').value = '';
            document.getElementById('edit-user-role').value = u.role;

            const roleGroup = document.getElementById('edit-user-role-group');
            roleGroup.classList.toggle('hidden', u.username === 'admin');

            const currentAssigned = u.assignedCategories || (u.assignedCategory ? [u.assignedCategory] : []);
            const catListEl = document.getElementById('edit-judge-categories-list');
            catListEl.innerHTML = state.categories.map(c => `
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" name="edit-judge-cat" value="${escapeHtml(c.name)}" ${currentAssigned.includes(c.name) ? 'checked' : ''} class="accent-lib-wood">
                    <span>${escapeHtml(c.name)}</span>
                </label>
            `).join('');

            toggleEditJudgeCategories();
            const modal = document.getElementById('edit-user-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.toggleEditJudgeCategories = function() {
            const role = document.getElementById('edit-user-role').value;
            document.getElementById('edit-judge-categories-group').classList.toggle('hidden', role !== 'judge');
            document.getElementById('edit-user-class-group').classList.toggle('hidden', role !== 'student');
        };

        window.saveEditedUser = async function(e) {
            e.preventDefault();
            const id = document.getElementById('edit-user-id').value;
            const role = document.getElementById('edit-user-role').value;
            const className = role === 'student' ? document.getElementById('edit-user-class').value.trim() : '';
            const name = document.getElementById('edit-user-name').value.trim();
            const username = document.getElementById('edit-user-username').value.trim();
            const newPassword = document.getElementById('edit-user-password').value.trim();

            const assignedCategories = role === 'judge'
                ? Array.from(document.querySelectorAll('input[name="edit-judge-cat"]:checked')).map(el => el.value)
                : [];

            const updatePayload = { role, className, name, username, assignedCategories };
            if (newPassword) {
                updatePayload.passwordHash = await hashPassword(newPassword);
                updatePayload.password = '';
            }

            try {
                await updateDoc(doc(db, 'users', id), updatePayload);
                closeModal('edit-user-modal');
                showToast('帳號資料已更新！');
            } catch (err) {
                showToast('更新失敗：' + err.message, true);
            }
        };

        // 作品修改視窗
        window.openEditWorkModal = function(workId) {
            const w = state.works.find(item => item.id === workId);
            if (!w) return;
            document.getElementById('edit-work-id').value = w.id;
            const catSelect = document.getElementById('edit-work-category');
            catSelect.innerHTML = state.categories.map(c => `<option value="${escapeHtml(c.name)}" ${c.name === w.category ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('');
            document.getElementById('edit-work-link').value = w.driveLink;

            const modal = document.getElementById('edit-work-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.saveEditedWork = async function(e) {
            e.preventDefault();
            const id = document.getElementById('edit-work-id').value;
            const category = document.getElementById('edit-work-category').value;
            const driveLink = document.getElementById('edit-work-link').value.trim();

            try {
                await updateDoc(doc(db, 'works', id), { category, driveLink });
                closeModal('edit-work-modal');
                showToast('參賽作品已更新！');
            } catch (err) {
                showToast('更新失敗：' + err.message, true);
            }
        };

        // 批次勾選與批次刪除：作品
        window.toggleSelectWork = function(id, checked) {
            if (checked) selectedWorkIds.add(id);
            else selectedWorkIds.delete(id);
            renderAdminPanel(document.getElementById('app-container'));
        };

        window.toggleSelectAllWorks = function(checked) {
            selectedWorkIds.clear();
            if (checked) state.works.forEach(w => selectedWorkIds.add(w.id));
            renderAdminPanel(document.getElementById('app-container'));
        };

        window.batchDeleteWorks = function() {
            if (selectedWorkIds.size === 0) return;
            openConfirmModal(
                `批次刪除 ${selectedWorkIds.size} 件作品`,
                '確定要永久刪除所有勾選的參賽作品與相關評分紀錄嗎？此操作無法復原。',
                async () => {
                    const ids = Array.from(selectedWorkIds);
                    await Promise.all(ids.map(id => deleteDoc(doc(db, 'works', id))));
                    selectedWorkIds.clear();
                    showToast(`已成功批次刪除 ${ids.length} 件作品！`);
                }
            );
        };

        // 批次勾選與批次刪除：學生帳號
        window.toggleSelectStudent = function(id, checked) {
            if (checked) selectedStudentIds.add(id);
            else selectedStudentIds.delete(id);
            renderAdminPanel(document.getElementById('app-container'));
        };

        window.toggleSelectAllStudents = function(checked) {
            selectedStudentIds.clear();
            if (checked) {
                state.users.filter(u => u.role === 'student').forEach(u => selectedStudentIds.add(u.id));
            }
            renderAdminPanel(document.getElementById('app-container'));
        };

        window.batchDeleteStudents = function() {
            if (selectedStudentIds.size === 0) return;
            openConfirmModal(
                `批次刪除 ${selectedStudentIds.size} 筆學生帳號`,
                '確定要刪除所有勾選的學生帳號嗎？刪除後學生將無法登入。',
                async () => {
                    const ids = Array.from(selectedStudentIds);
                    await Promise.all(ids.map(id => deleteDoc(doc(db, 'users', id))));
                    selectedStudentIds.clear();
                    showToast(`已成功批次刪除 ${ids.length} 筆學生帳號！`);
                }
            );
        };

        // 單筆刪除通用處理
        window.deleteDocHandler = function(colName, docId, msg) {
            openConfirmModal('確認刪除', msg, async () => {
                try {
                    await deleteDoc(doc(db, colName, docId));
                    selectedWorkIds.delete(docId);
                    selectedStudentIds.delete(docId);
                    showToast('資料已刪除！');
                } catch (err) {
                    showToast('刪除失敗：' + err.message, true);
                }
            });
        };

        // 獎項與公開狀態即時更新
        window.updateWorkAward = async function(workId, award) {
            await updateDoc(doc(db, 'works', workId), { award });
            showToast('得獎獎項已更新');
        };

        window.updateWorkVisibility = async function(workId, isPublic) {
            await updateDoc(doc(db, 'works', workId), { isPublic });
            showToast(isPublic ? '已設為公開展示' : '已隱藏該作品');
        };

        // 新增項目、公告、網站設定
        window.addCategory = async function(e) {
            e.preventDefault();
            const name = document.getElementById('new-cat-name').value.trim();
            if (!name) return;
            await addDoc(collection(db, 'categories'), { name, order: state.categories.length + 1 });
            document.getElementById('new-cat-name').value = '';
            showToast('比賽項目已新增');
        };

        window.addNews = async function(e) {
            e.preventDefault();
            const title = document.getElementById('news-title').value.trim();
            const content = document.getElementById('news-content').value.trim();
            await addDoc(collection(db, 'news'), { title, content, createdAt: Date.now() });
            e.target.reset();
            showToast('最新消息已發布');
        };

        window.saveSiteSettings = async function(e) {
            e.preventDefault();
            const schoolName = document.getElementById('set-school-name').value.trim();
            const contestTitle = document.getElementById('set-contest-title').value.trim();
            const allowSubmission = document.getElementById('set-allow-sub').checked;
            await setDoc(doc(db, 'system', 'settings'), { schoolName, contestTitle, allowSubmission });
            showToast('網站設定已儲存');
        };

        // 匯出成績總表 CSV
        window.exportScoresCsv = function() {
            const headers = ['比賽項目', '班級', '學生姓名', '平均總分', '評分人數', '得獎獎項', '作品連結'];
            const rows = state.works.map(w => {
                const student = state.users.find(u => u.id === w.studentId) || {};
                const cls = w.className || student.className || '';
                const nm = w.studentName || student.name || '';
                const sc = state.scores.filter(s => s.workId === w.id);
                const avg = sc.length > 0 ? (sc.reduce((a, b) => a + b.total, 0) / sc.length).toFixed(1) : '0';
                return [w.category, cls, nm, avg, sc.length, w.award || '無', w.driveLink]
                    .map(v => `"${String(v).replace(/"/g, '""')}"`).join(',');
            });

            const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${state.settings.schoolName}_${state.settings.contestTitle}_成績總表.csv`;
            link.click();
        };

        // 啟動系統
        initSystem();
    </script>
</body>
</html>
