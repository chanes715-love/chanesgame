<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>櫻花盃 國小資訊應用競賽</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Serif TC (標題/書本感) & Noto Sans TC (內文) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'lib-bg': '#CCE0C2',       /* 蘋果綠背景 */
                        'lib-wood': '#8B5A2B',     /* 木頭書架色 */
                        'lib-wood-dark': '#5C3A21',/* 深色木頭 */
                        'lib-red': '#C95B52',      /* 繪本紅 */
                        'lib-orange': '#E09F41',   /* 繪本橘 */
                        'lib-olive': '#85A873',    /* 繪本綠 */
                        'lib-teal': '#53918D',     /* 繪本藍綠 */
                        'lib-purple': '#8F6E93',   /* 繪本紫 */
                        'lib-pink': '#D58187',     /* 繪本粉 */
                        'lib-text': '#2C3E50'      /* 深色文字 */
                    },
                    fontFamily: {
                        'serif': ['"Noto Serif TC"', 'serif'],
                        'sans': ['"Noto Sans TC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #CCE0C2; 
            color: #2C3E50; 
            font-family: '"Noto Sans TC"', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* 標題與特殊裝飾字體 */
        .font-serif-title { font-family: '"Noto Serif TC"', serif; }

        /* 輸入框共用樣式 */
        .lib-input {
            background-color: white;
            border: 1px solid #CBD5E1;
            border-radius: 4px;
            padding: 10px 14px;
            color: #334155;
            transition: all 0.2s;
            width: 100%;
        }
        .lib-input:focus {
            outline: none;
            border-color: #85A873;
            box-shadow: 0 0 0 3px rgba(133, 168, 115, 0.2);
        }

        /* 按鈕共用樣式 */
        .lib-btn {
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 700;
            transition: all 0.2s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .lib-btn:hover { opacity: 0.85; transform: translateY(-1px); }
        .lib-btn-wood { background-color: #8B5A2B; color: white; }
        .lib-btn-green { background-color: #85A873; color: white; }
        .lib-btn-blue { background-color: #53918D; color: white; }
        .lib-btn-red { background-color: #C95B52; color: white; }
        .lib-btn-outline { border: 1px solid #CBD5E1; background: white; color: #475569; }
        .lib-btn-outline:hover { background: #F8FAFC; }

        /* Toast Animation */
        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-enter-active { transform: translateY(0); opacity: 1; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        .toast-leave { transform: translateY(0); opacity: 1; }
        .toast-leave-active { transform: translateY(100%); opacity: 0; transition: all 0.3s ease-in; }
        
        /* 富文本內容修飾 */
        .rich-text-content p { margin-bottom: 0.5rem; line-height: 1.6; }
        .rich-text-content a { color: #53918D; text-decoration: underline; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Navigation (Wood Shelf style bottom border) -->
    <nav class="bg-white border-b-[8px] border-lib-wood shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20">
                <!-- Logo -->
                <div class="flex items-center cursor-pointer group" onclick="navigate('works')">
                    <i class="fa-solid fa-book-open text-lib-wood-dark text-3xl mr-3 group-hover:scale-110 transition"></i>
                    <span class="font-serif-title font-black text-2xl tracking-wide text-gray-800" id="nav-site-title">資訊應用競賽</span>
                    <span class="text-sm ml-3 hidden sm:inline border-l-2 border-gray-300 pl-3 text-gray-500 font-bold" id="nav-site-subtitle"></span>
                </div>
                <!-- Menu -->
                <div class="flex items-center space-x-2 sm:space-x-3" id="nav-menu">
                    <!-- Nav items injected by JS -->
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10" id="app-content">
        <div class="flex flex-col justify-center items-center h-64 text-lib-wood">
            <i class="fa-solid fa-circle-notch fa-spin text-5xl mb-4"></i>
            <h2 class="text-xl font-bold tracking-widest">系統讀取中...</h2>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-lib-wood-dark text-white/80 py-6 mt-auto border-t-4 border-lib-wood">
        <div class="text-center">
            <p id="footer-text" class="font-bold text-sm tracking-widest">© 2026 資訊應用競賽系統. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-8 right-6 z-50 flex flex-col space-y-3"></div>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 主題色彩配置 (對應繪本風的顏色)
        const themeColors = [
            { border: 'border-lib-red', bg: 'bg-lib-red' },
            { border: 'border-lib-orange', bg: 'bg-lib-orange' },
            { border: 'border-lib-olive', bg: 'bg-lib-olive' },
            { border: 'border-lib-teal', bg: 'bg-lib-teal' },
            { border: 'border-lib-purple', bg: 'bg-lib-purple' },
            { border: 'border-lib-pink', bg: 'bg-lib-pink' }
        ];

        // 將分類ID轉換為固定顏色的函式
        const getColorTheme = (str) => {
            if (!str) return themeColors[0];
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            return themeColors[Math.abs(hash) % themeColors.length];
        };

        const state = {
            currentPage: 'works', 
            currentUser: null, 
            authUser: null, 
            data: {
                news: [], categories: [], works: [], users: [],
                settings: { title: '長安國小', subtitle: '資訊應用競賽' }
            },
            unsubscribes: []
        };

        window.showToast = (message, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colorClass = type === 'success' ? 'bg-lib-olive' : 'bg-lib-red';
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-circle-exclamation';
            
            toast.className = `${colorClass} text-white px-6 py-4 rounded shadow-lg font-bold flex items-center space-x-3 toast-enter text-base tracking-wide`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-xl"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-enter-active');
            });

            setTimeout(() => {
                toast.classList.remove('toast-enter-active');
                toast.classList.add('toast-leave-active');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.navigate = (page) => { state.currentPage = page; render(); };

        const getCollectionRef = (colName) => collection(db, 'artifacts', appId, 'public', 'data', colName);
        const getDocRef = (colName, docId) => doc(db, 'artifacts', appId, 'public', 'data', colName, docId);

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
                showToast("系統連線異常 🔌", "error");
                render(); 
            }
        };

        onAuthStateChanged(auth, async (user) => {
            state.authUser = user;
            if (user) {
                setupRealtimeListeners();
                render(); 
            } else {
                cleanupListeners();
                render(); 
            }
        });

        const setupRealtimeListeners = () => {
            cleanupListeners(); 
            const collections = ['news', 'categories', 'works', 'users', 'settings'];
            
            collections.forEach(col => {
                const unsubscribe = onSnapshot(getCollectionRef(col), (snapshot) => {
                    if (col === 'settings') {
                        if (!snapshot.empty) {
                            state.data.settings = snapshot.docs[0].data();
                            state.data.settings.id = snapshot.docs[0].id;
                        }
                    } else {
                        state.data[col] = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    }
                    
                    if (col === 'users' && state.data.users.length === 0) createDefaultAdmin();
                    
                    if (col === 'users' && state.currentUser) {
                        const updatedMe = state.data.users.find(u => u.id === state.currentUser.id);
                        if (!updatedMe) {
                            window.handleLogout();
                            showToast("帳號已被移除", "error");
                        } else {
                            state.currentUser = updatedMe; 
                        }
                    }
                    render();
                }, (error) => {
                    console.error(`Error listening to ${col}:`, error);
                    showToast(`無法讀取資料 (${col}) 😥`, "error");
                });
                state.unsubscribes.push(unsubscribe);
            });
        };

        const cleanupListeners = () => { state.unsubscribes.forEach(unsub => unsub()); state.unsubscribes = []; };

        const createDefaultAdmin = async () => {
            try {
                await addDoc(getCollectionRef('users'), { username: 'admin', password: 'admin123', name: '系統管理員', role: 'admin', createdAt: Date.now() });
            } catch (e) { console.error(e); }
        };

        const render = () => {
            const content = document.getElementById('app-content');
            
            // 更新網站設定的標題
            document.title = `${state.data.settings.title} | ${state.data.settings.subtitle}`;
            document.getElementById('nav-site-title').innerHTML = escapeHtml(state.data.settings.title);
            document.getElementById('nav-site-subtitle').innerHTML = escapeHtml(state.data.settings.subtitle);
            document.getElementById('footer-text').innerText = `© 2026 ${state.data.settings.title} ${state.data.settings.subtitle}. All Rights Reserved.`;

            if (!state.authUser) {
                content.innerHTML = `
                    <div class="flex flex-col justify-center items-center h-64 bg-white p-10 max-w-lg mx-auto mt-10 text-center shadow rounded-lg border-t-4 border-lib-red">
                        <i class="fa-solid fa-triangle-exclamation text-5xl text-lib-red mb-4"></i>
                        <h2 class="text-2xl font-black mb-2 text-gray-800 font-serif-title">連線發生問題</h2>
                        <p class="text-gray-600">請重新整理網頁試試看！🔄</p>
                    </div>`;
                return; 
            }
            
            renderNav();
            
            switch (state.currentPage) {
                case 'home': content.innerHTML = tmplHome(); break;
                case 'works': content.innerHTML = tmplWorks(); break;
                case 'login': content.innerHTML = tmplLogin(); break;
                case 'admin': content.innerHTML = state.currentUser?.role === 'admin' ? tmplAdmin() : tmplWorks(); break;
                case 'student': content.innerHTML = state.currentUser?.role === 'student' ? tmplStudent() : tmplWorks(); break;
                case 'judge': content.innerHTML = state.currentUser?.role === 'judge' ? tmplJudge() : tmplWorks(); break;
                default: content.innerHTML = tmplWorks();
            }
        };

        const renderNav = () => {
            const menu = document.getElementById('nav-menu');
            let html = `
                <button onclick="navigate('works')" class="lib-btn ${state.currentPage==='works'?'bg-lib-wood/10 text-lib-wood':'text-gray-600 hover:bg-gray-100'}">作品大廳</button>
                <button onclick="navigate('home')" class="lib-btn ${state.currentPage==='home'?'bg-lib-wood/10 text-lib-wood':'text-gray-600 hover:bg-gray-100'}">最新消息</button>
            `;

            if (!state.currentUser) {
                html += `<button onclick="navigate('login')" class="lib-btn lib-btn-wood ml-2 shadow-sm">登入系統</button>`;
            } else {
                const roleLabels = { admin: '管理系統', student: '學生專區', judge: '評分專區' };
                const rolePage = state.currentUser.role;

                html += `
                    <button onclick="navigate('${rolePage}')" class="lib-btn lib-btn-outline ml-2 text-lib-teal border-lib-teal/30 bg-lib-teal/5 hover:bg-lib-teal/10 shadow-sm">${roleLabels[rolePage]}</button>
                    <span class="text-sm font-bold text-gray-600 hidden md:inline ml-3 px-3 py-1 bg-gray-100 rounded border border-gray-200"><i class="fa-solid fa-user text-gray-400 mr-1"></i> ${state.currentUser.name}</span>
                    <button onclick="handleLogout()" class="text-gray-400 hover:text-lib-red transition px-3 py-2 ml-1" title="登出"><i class="fa-solid fa-right-from-bracket text-lg"></i></button>
                `;
            }
            menu.innerHTML = html;
        };

        const tmplWorks = () => {
            window.currentFilterCat = window.currentFilterCat || '';
            const getCatName = (id) => state.data.categories.find(c => c.id === id)?.name || '未分類';
            const getStudentName = (id) => state.data.users.find(u => u.id === id)?.name || '未知同學';
            
            let displayWorks = state.data.works.filter(w => w.isPublic); 
            if (window.currentFilterCat) {
                displayWorks = displayWorks.filter(w => w.categoryId === window.currentFilterCat);
            }
            
            const worksHtml = displayWorks.map(w => {
                const displayTitle = `${escapeHtml(getCatName(w.categoryId))} - ${escapeHtml(getStudentName(w.studentId))}`;
                const color = getColorTheme(w.categoryId); // 取得對應顏色

                let awardHtml = '<span class="text-gray-600 font-bold">作品參展</span>';
                if (w.award === '優等') {
                    awardHtml = `<span class="text-lib-orange font-bold text-base tracking-wide"><i class="fa-solid fa-crown mr-1"></i>榮獲優等</span>`;
                } else if (w.award === '佳作') {
                    awardHtml = `<span class="text-lib-teal font-bold"><i class="fa-solid fa-medal mr-1"></i>榮獲佳作</span>`;
                }

                return `
                <div class="bg-white rounded-t-lg rounded-b-sm shadow-md border-t-[8px] ${color.border} flex flex-col justify-between transform transition hover:-translate-y-1 hover:shadow-lg h-full">
                    <div class="p-5 flex-grow">
                        <div class="mb-4 flex justify-between items-start">
                            <span class="${color.bg} text-white px-3 py-1 text-xs font-bold rounded-sm inline-block shadow-sm tracking-widest">${escapeHtml(getCatName(w.categoryId))}</span>
                            <span class="text-gray-400 text-xs font-bold"><i class="fa-regular fa-eye"></i> ${w.views || 0}</span>
                        </div>
                        <h3 class="text-2xl font-bold text-gray-800 font-serif-title mb-4 leading-snug cursor-pointer hover:opacity-70" onclick="viewWorkDetail('${w.id}')">${displayTitle}</h3>
                        
                        <div class="bg-[#FCF8E8] border border-[#F0E6C8] rounded p-3 text-sm mb-4">
                            <span class="font-bold text-gray-800 mb-1 block">評審講評與榮譽：</span>
                            ${awardHtml}
                        </div>
                    </div>
                    <div class="p-4 pt-0 mt-auto">
                        <button onclick="viewWorkDetail('${w.id}')" class="w-full ${color.bg} hover:opacity-85 text-white font-bold py-2.5 rounded shadow-sm transition tracking-wider">查看作品內容</button>
                    </div>
                </div>
            `}).join('') || `
                <div class="col-span-full text-center py-20 bg-white shadow rounded-lg border-t-4 border-gray-300">
                    <i class="fa-solid fa-book text-6xl text-gray-300 mb-4"></i>
                    <p class="text-gray-500 font-bold text-lg tracking-wide">書架上目前還沒有展示的作品喔！</p>
                </div>`;

            const catOptions = state.data.categories.map(c => `<option value="${c.id}" ${window.currentFilterCat === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('');

            return `
                <div class="max-w-6xl mx-auto">
                    <div class="flex flex-col sm:flex-row justify-between items-end sm:items-center mb-8 pb-4 border-b border-lib-wood/20">
                        <div class="flex items-center mb-4 sm:mb-0">
                            <i class="fa-solid fa-layer-group text-lib-wood text-3xl mr-3"></i>
                            <h2 class="text-3xl font-black text-gray-800 font-serif-title">競賽作品大廳</h2>
                        </div>
                        <div class="flex items-center bg-white border border-gray-300 rounded px-3 py-1.5 shadow-sm w-full sm:w-auto">
                            <i class="fa-solid fa-filter text-gray-400 mr-2"></i>
                            <span class="text-sm font-bold text-gray-600 mr-2 whitespace-nowrap">過濾項目：</span>
                            <select onchange="filterWorks(this.value)" class="bg-transparent border-none focus:ring-0 text-sm font-bold text-lib-wood outline-none cursor-pointer w-full">
                                <option value="">-- 顯示全部作品 --</option>
                                ${catOptions}
                            </select>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        ${worksHtml}
                    </div>
                </div>

                <!-- Work Detail Modal -->
                <div id="work-modal" class="fixed inset-0 bg-gray-900/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
                    <div class="bg-white rounded-lg w-full max-w-2xl max-h-[90vh] overflow-y-auto p-8 relative shadow-2xl border-t-8 border-lib-wood" id="modal-container-style">
                        <button onclick="closeWorkModal()" class="absolute top-4 right-4 text-gray-400 hover:text-lib-red text-2xl transition"><i class="fa-solid fa-xmark"></i></button>
                        <div id="modal-content"></div>
                    </div>
                </div>
            `;
        };

        const tmplHome = () => {
            const newsHtml = state.data.news.sort((a,b) => b.createdAt - a.createdAt).map(n => `
                <div class="border-b border-gray-200 py-4 hover:bg-gray-50 px-4 rounded transition cursor-pointer group" onclick="viewNewsDetail('${n.id}')">
                    <div class="flex items-center justify-between mb-1">
                        <h3 class="text-xl font-bold text-gray-800 font-serif-title group-hover:text-lib-wood transition">
                            <i class="fa-solid fa-caret-right text-lib-orange mr-1 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                            ${escapeHtml(n.title)}
                        </h3>
                    </div>
                    <div class="text-sm font-bold text-gray-400 flex items-center">
                        <i class="fa-regular fa-clock mr-1.5"></i> ${new Date(n.createdAt).toLocaleDateString('zh-TW')}
                    </div>
                </div>
            `).join('') || `
                <div class="text-center p-12 bg-gray-50 rounded border border-dashed border-gray-300">
                    <i class="fa-regular fa-newspaper text-5xl text-gray-300 mb-3 block"></i>
                    <p class="text-gray-500 font-bold">佈告欄目前空空的喔！</p>
                </div>`;

            return `
                <div class="max-w-4xl mx-auto">
                    <div class="flex items-center mb-6 pb-3 border-b-2 border-lib-wood">
                        <i class="fa-solid fa-thumbtack text-lib-red text-2xl mr-3 transform -rotate-45"></i>
                        <h2 class="text-2xl font-black text-gray-800 font-serif-title">最新消息佈告欄</h2>
                    </div>
                    <div class="bg-white p-2 rounded shadow-sm border border-gray-200 border-t-[6px] border-t-lib-wood-dark">
                        ${newsHtml}
                    </div>
                </div>

                <!-- News Detail Modal -->
                <div id="news-modal" class="fixed inset-0 bg-gray-900/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
                    <div class="bg-white rounded-lg w-full max-w-3xl max-h-[90vh] overflow-y-auto p-8 relative shadow-2xl border-t-8 border-lib-olive">
                        <button onclick="closeNewsModal()" class="absolute top-4 right-4 text-gray-400 hover:text-lib-red text-2xl transition"><i class="fa-solid fa-xmark"></i></button>
                        <div id="news-modal-content"></div>
                    </div>
                </div>
            `;
        };

        const tmplLogin = () => `
            <div class="max-w-md mx-auto mt-12 bg-white rounded-lg shadow-md border-t-[8px] border-t-lib-wood p-8 text-center relative overflow-hidden">
                <div class="absolute -top-4 -right-4 text-lib-bg opacity-50"><i class="fa-solid fa-microchip text-9xl"></i></div>
                <div class="mb-8 relative z-10">
                    <div class="w-16 h-16 bg-lib-bg rounded-full flex items-center justify-center mx-auto mb-4 border border-lib-olive/30">
                        <i class="fa-solid fa-user-lock text-lib-olive text-2xl"></i>
                    </div>
                    <h2 class="text-2xl font-black text-gray-800 font-serif-title tracking-widest">系統登入</h2>
                    <p class="text-sm font-bold text-gray-500 mt-2">請輸入您的借閱/管理帳號</p>
                </div>
                <form onsubmit="handleLogin(event)" class="space-y-6 text-left relative z-10">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">帳號</label>
                        <input type="text" id="login-username" required class="lib-input" placeholder="輸入帳號...">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">密碼</label>
                        <input type="password" id="login-password" required class="lib-input" placeholder="輸入密碼...">
                    </div>
                    <button type="submit" class="lib-btn lib-btn-wood w-full py-3 text-lg mt-4 shadow-sm tracking-widest">登 入</button>
                </form>
            </div>
        `;

        const tmplAdmin = () => {
            window.currentAdminTab = window.currentAdminTab || 'grades';
            
            const tabClass = (tab, colorClass) => window.currentAdminTab === tab

        window.handleBulkImport = async () => {
            if (!state.authUser || state.currentUser?.role !== 'admin') return;
            const text = document.getElementById('bulk-students').value.trim();
            if (!text) { showToast('請輸入資料', 'error'); return; }
            
            const lines = text.split('\n');
            let successCount = 0; let skipCount = 0;
            
            showToast('開始匯入名單...');
            for (let line of lines) {
                const parts = line.split(',').map(s => s.trim());
                if (parts.length >= 3) {
                    const [name, username, password] = parts;
                    if (name && username && password) {
                        if (!state.data.users.some(u => u.username === username)) {
                            try {
                                await addDoc(getCollectionRef('users'), { name, username, password, role: 'student', createdAt: Date.now() });
                                successCount++;
                            } catch(e) { console.error(e); skipCount++; }
                        } else { skipCount++; }
                    }
                }
            }
            showToast(`匯入完成！成功：${successCount}筆，略過重複：${skipCount}筆`);
            document.getElementById('bulk-students').value = '';
        };

        window.exportScoresToCSV = () => {

            csvContent += "比賽項目,參賽學生,平均分數,獎項,是否公開,雲端連結\n";
            
            state.data.works.forEach(w => {
                let totalScore = 0; let count = 0;

                const avgScore = count > 0 ? (totalScore/count).toFixed(1) : '0';
                
                const row = [
                    `"${getCatName(w.categoryId)}"`, `"${getStudentName(w.studentId)}"`, avgScore, `"${w.award || ''}"`, w.isPublic ? '是' : '否', `"${w.driveLink}"`
                ];
                csvContent += row.join(",") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });

                    ${awardHtml}
                    <h2 class="text-3xl font-black text-gray-800 mb-5 font-serif-title">${displayTitle}</h2>
                    <div class="inline-flex items-center space-x-4 bg-gray-50 px-5 py-2 rounded-full border border-gray-200">
                        <span class="text-gray-600 font-bold"><i class="fa-solid fa-user-pen text-gray-400 mr-1"></i> ${escapeHtml(studentName)}</span>
                        <span class="text-gray-300 font-bold text-xl">|</span>
                        <span class="text-gray-600 font-bold"><i class="fa-regular fa-eye text-gray-400 mr-1"></i> ${(work.views || 0) + 1} 次觀看</span>
                    </div>
                </div>
                <div class="text-center mt-6">
                    <a href="${escapeHtml(work.driveLink)}" target="_blank" class="lib-btn ${color.bg} px-10 py-3.5 shadow-md text-lg inline-flex tracking-wider text-white">
                        <i class="fa-brands fa-google-drive mr-2 text-xl"></i>開啟完整作品檔案
                    </a>
                </div>
            `;
            document.getElementById('work-modal').classList.remove('hidden');
        };

        window.closeWorkModal = () => { document.getElementById('work-modal').classList.add('hidden'); };

        window.viewNewsDetail = (newsId) => {
            const news = state.data.news.find(n => n.id === newsId);
            if (!news) return;

            let attachmentsHtml = '';
            if (news.attachments && news.attachments.length > 0) {
                attachmentsHtml = `
                    <div class="mt-8 pt-5 border-t border-gray-200 flex flex-wrap gap-3">
                        <p class="w-full text-sm font-bold text-gray-500 mb-1"><i class="fa-solid fa-paperclip mr-1 text-gray-400"></i> 附加連結：</p>
                        ${news.attachments.map(att => `
                            <a href="${escapeHtml(att.url)}" target="_blank" class="lib-btn lib-btn-outline text-sm px-4 py-2 flex items-center">
                                <i class="fa-solid fa-link mr-2 text-lib-teal"></i>${escapeHtml(att.name)}
                            </a>
                        `).join('')}
                    </div>
                `;
            }

            const modalContent = document.getElementById('news-modal-content');
            modalContent.innerHTML = `
                <div class="mb-5 border-b border-gray-200 pb-5">
                    <h2 class="text-2xl font-black text-gray-800 mb-3 font-serif-title">${escapeHtml(news.title)}</h2>
                    <span class="text-xs font-bold text-gray-500 bg-gray-100 border border-gray-200 px-3 py-1 rounded"><i class="fa-regular fa-clock mr-1"></i> 發佈日期：${new Date(news.createdAt).toLocaleDateString('zh-TW')}</span>
                </div>
                <div class="text-gray-700 rich-text-content text-base min-h-[100px]">
                    ${news.content}
                </div>
                ${attachmentsHtml}
            `;
            
            document.getElementById('news-modal').classList.remove('hidden');
        };

        window.closeNewsModal = () => { document.getElementById('news-modal').classList.add('hidden'); };

        const escapeHtml = (unsafe) => {
            if(!unsafe) return '';
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        };

        window.confirm = (msg) => {
            try { return window.top.confirm(msg); } catch(e) { return true; }
        }

        initAuth();

    </script>
</body>
</html>
